        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - BearerAuth: []
      summary: 生成我的 MCP Key
      tags:
      - MCP
