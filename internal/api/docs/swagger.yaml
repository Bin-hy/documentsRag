definitions:
  api.ConfigUpdateRequest:
    properties:
      embedder:
        $ref: '#/definitions/api.EmbedderPatch'
      llm:
        $ref: '#/definitions/api.LLMPatch'
      loader:
        $ref: '#/definitions/api.LoaderPatch'
      mcp:
        $ref: '#/definitions/api.MCPPatch'
      rag_strategy:
        $ref: '#/definitions/config.StrategyConfig'
      reranker:
        $ref: '#/definitions/api.RerankerPatch'
      retriever:
        $ref: '#/definitions/api.RetrieverPatch'
    type: object
  api.ConfigView:
    properties:
      is_bootstrap:
        description: 当前 Key 是否为 bootstrap（前端据此允许编辑）
        type: boolean
      mutable:
        $ref: '#/definitions/api.MutableConfigView'
      read_only:
        items:
          $ref: '#/definitions/api.ReadOnlyConfig'
        type: array
    type: object
  api.CreateMyKeyResult:
    properties:
      id:
        type: string
      key:
        type: string
    type: object
  api.EmbedderPatch:
    properties:
      model:
        type: string
    type: object
  api.EmbedderView:
    properties:
      dimension:
        type: integer
      model:
        type: string
    type: object
  api.LLMPatch:
    properties:
      max_tokens:
        type: integer
      model:
        type: string
      temperature:
        type: number
      timeout:
        type: integer
    type: object
  api.LLMView:
    properties:
      max_tokens:
        type: integer
      model:
        type: string
      temperature:
        type: number
      timeout:
        type: integer
    type: object
  api.LoaderPatch:
    properties:
      min_readable_chars:
        type: integer
    type: object
  api.LoaderView:
    properties:
      min_readable_chars:
        type: integer
    type: object
  api.MCPPatch:
    properties:
      audit_param_limit:
        type: integer
      enabled:
        type: boolean
      path:
        type: string
    type: object
  api.MCPView:
    properties:
      audit_param_limit:
        type: integer
      enabled:
        type: boolean
      path:
        type: string
    type: object
  api.MutableConfigView:
    properties:
      embedder:
        $ref: '#/definitions/api.EmbedderView'
      llm:
        $ref: '#/definitions/api.LLMView'
      loader:
        $ref: '#/definitions/api.LoaderView'
      mcp:
        $ref: '#/definitions/api.MCPView'
      rag_strategy:
        $ref: '#/definitions/config.StrategyConfig'
      reranker:
        $ref: '#/definitions/api.RerankerView'
      retriever:
        $ref: '#/definitions/api.RetrieverView'
    type: object
  api.MyMCPKey:
    properties:
      enabled:
        type: boolean
      id:
        type: string
      mcp_kb_ids:
        items:
          type: string
        type: array
      mcp_kb_scope:
        type: string
      mcp_tools:
        items:
          type: string
        type: array
    type: object
  api.MyMCPStatus:
    properties:
      global_enabled:
        description: 全局 mcp.enabled（bootstrap 管部署级）
        type: boolean
      key:
        allOf:
        - $ref: '#/definitions/api.MyMCPKey'
        description: 我的凭据；无则 null
      mcp_path:
        description: 配置的端点路径（连接信息用）
        type: string
    type: object
  api.ReadOnlyConfig:
    properties:
      key:
        type: string
      needs_restart:
        type: boolean
      value:
        type: string
    type: object
  api.RerankerPatch:
    properties:
      model:
        type: string
      top_n:
        type: integer
    type: object
  api.RerankerView:
    properties:
      model:
        type: string
      top_n:
        type: integer
    type: object
  api.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  api.RetrieverPatch:
    properties:
      bm25_weight:
        type: number
      top_k:
        type: integer
      vector_weight:
        type: number
    type: object
  api.RetrieverView:
    properties:
      bm25_weight:
        type: number
      top_k:
        type: integer
      vector_weight:
        type: number
    type: object
  api.chatRequest:
    properties:
      enhanced:
        description: 增强模式（function calling 工具，如 web_search）
        type: boolean
      kb_id:
        description: 知识库范围，空表示不限定
        type: string
      question:
        type: string
      session_id:
        type: string
      strategy:
        allOf:
        - $ref: '#/definitions/config.StrategyConfig'
        description: 单次请求策略覆盖
    required:
    - question
    - session_id
    type: object
  api.createAPIKeyRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  api.createKBRequest:
    properties:
      description:
        type: string
      name:
        type: string
      strategy:
        allOf:
        - $ref: '#/definitions/config.StrategyConfig'
        description: 知识库级策略
    required:
    - name
    type: object
  api.exchangeRequest:
    properties:
      ticket:
        type: string
    required:
    - ticket
    type: object
  api.kbView:
    properties:
      createdAt:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      strategy:
        type: string
      updatedAt:
        type: string
    type: object
  api.keyView:
    properties:
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      last_used_at:
        type: string
      mcp_kb_ids:
        items:
          type: string
        type: array
      mcp_kb_scope:
        type: string
      mcp_tools:
        description: MCP 权限（spec F4/F5/F6；空 = 无 MCP 权限）
        items:
          type: string
        type: array
      name:
        type: string
    type: object
  api.toggleAPIKeyRequest:
    properties:
      enabled:
        description: 不能用 required：false 是合法值
        type: boolean
    type: object
  api.updateKBRequest:
    properties:
      description:
        type: string
      name:
        type: string
      strategy:
        allOf:
        - $ref: '#/definitions/config.StrategyConfig'
        description: 知识库级策略（nil = 不修改）
    required:
    - name
    type: object
  auth.ProviderView:
    properties:
      display_name:
        type: string
      name:
        type: string
      type:
        description: oidc / oauth2
        type: string
    type: object
  config.StrategyConfig:
    properties:
      data_sources:
        description: DataSources 允许的数据源列表；空=未设置（合并后默认仅 vector_store）
        items:
          type: string
        type: array
      decomposition:
        type: string
      fusion:
        type: string
      hyde:
        type: string
      query:
        type: string
      routing:
        type: string
      step_back:
        type: string
      thinking:
        description: off / on，空=继承
        type: string
    type: object
  llm.Message:
    properties:
      content:
        type: string
      reasoning_content:
        description: DeepSeek thinking 思维链：thinking 模式下 assistant 消息（含 tool_calls）回传时必须原样附带，否则
          API 400
        type: string
      role:
        type: string
      sources:
        description: 引用来源 JSON 数组字符串（历史持久化用，空 = 无引用）
        type: string
      tool_call_id:
        description: tool 结果消息回引的工具调用 ID
        type: string
      tool_calls:
        description: assistant 消息的工具调用列表
        items:
          $ref: '#/definitions/llm.ToolCall'
        type: array
    type: object
  llm.ToolCall:
    properties:
      arguments:
        description: 参数 JSON 字符串
        type: string
      id:
        description: 工具调用 ID（tool 结果消息回引用）
        type: string
      name:
        description: 工具名
        type: string
    type: object
  loader.SupportedType:
    properties:
      category:
        description: text / image / audio / video
        type: string
      ext:
        description: 如 ".mp3"（小写）
        type: string
      reason:
        description: 不支持原因
        type: string
      supported:
        type: boolean
    type: object
  rag.RAGResult:
    properties:
      answer:
        type: string
      sources:
        items:
          $ref: '#/definitions/rag.Source'
        type: array
      thinking:
        description: 思考链路（F8，关闭时省略）
        items:
          $ref: '#/definitions/rag.ThinkingStep'
        type: array
    type: object
  rag.Source:
    properties:
      anchor:
        description: Markdown 标题锚点
        type: string
      end_ms:
        description: 定位结束时间戳（毫秒）
        type: integer
      filename:
        description: 来源文件名（来自元数据）
        type: string
      heading:
        description: 标题上下文
        type: string
      id:
        description: 检索片段 ID
        type: string
      page_number:
        description: PDF 页码（从 1 开始）
        type: integer
      score:
        description: 检索分数
        type: number
      source_type:
        description: 来源类型（vector_store / web_search 等）
        type: string
      start_ms:
        description: 视频/音频定位起始时间戳（毫秒）
        type: integer
    type: object
  rag.ThinkingStep:
    properties:
      data:
        description: 环节结构化数据
      elapsed_ms:
        description: 环节耗时
        type: integer
      label:
        description: 前端展示标题
        type: string
      type:
        $ref: '#/definitions/rag.ThinkingStepType'
    type: object
  rag.ThinkingStepType:
    enum:
    - routing
    - query_rewrite
    - multi_query
    - retrieval
    - rerank
    - chunks
    - decompose
    - step_back
    - hyde
    - tool
    type: string
    x-enum-comments:
      StepChunks: 最终目标 chunks
      StepDecompose: 分解判定 + 子问题列表
      StepHyDE: 假设文档
      StepMultiQuery: 多查询变体生成
      StepRerank: 重排序前后对比
      StepRetrieval: 检索（单路或多路）
      StepRewrite: 单查询改写
      StepRouting: 路由判定
      StepStepBack: 回退问题
      StepTool: 工具调用（增强模式 function calling）
    x-enum-descriptions:
    - 路由判定
    - 单查询改写
    - 多查询变体生成
    - 检索（单路或多路）
    - 重排序前后对比
    - 最终目标 chunks
    - 分解判定 + 子问题列表
    - 回退问题
    - 假设文档
    - 工具调用（增强模式 function calling）
    x-enum-varnames:
    - StepRouting
    - StepRewrite
    - StepMultiQuery
    - StepRetrieval
    - StepRerank
    - StepChunks
    - StepDecompose
    - StepStepBack
    - StepHyDE
    - StepTool
  store.APIKeyPermissions:
    properties:
      mcp_kb_ids:
        description: 知识库白名单；nil = 清空
        items:
          type: string
        type: array
      mcp_kb_scope:
        description: '"" | "all" | "allowlist"'
        type: string
      mcp_tools:
        description: 允许的 Tool 白名单；nil = 清空
        items:
          type: string
        type: array
    type: object
  store.Document:
    properties:
      chunkIDs:
        items:
          type: string
        type: array
      createdAt:
        type: string
      filePath:
        type: string
      filename:
        type: string
      format:
        type: string
      id:
        type: string
      kbid:
        type: string
      size:
        format: int64
        type: integer
      status:
        description: pending / processing / completed / failed
        type: string
      taskID:
        type: string
    type: object
  store.Task:
    properties:
      createdAt:
        type: string
      documentID:
        type: string
      errorMessage:
        type: string
      id:
        type: string
      kbid:
        type: string
      retryCount:
        type: integer
      status:
        description: pending / processing / completed / failed
        type: string
      updatedAt:
        type: string
      warningMessage:
        description: 非阻断告警（如视频音轨降级），空 = 无
        type: string
    type: object
info:
  contact: {}
  description: 'BinRag 企业级文档知识库问答系统 API。所有接口需 `Authorization: Bearer <API Key>`（除
    Swagger 文档页本身）。统一响应格式 `{code, message, data}`，code=0 表示成功，非 0 为业务码（400/401/404/500）。'
  title: BinRag API
  version: "1.0"
paths:
  /api/v1/api-keys:
    get:
      description: 列出全部 API Key（不含 hash），含启用状态与最后使用时间
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.keyView'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - ApiKeyAuth: []
      summary: API Key 列表
      tags:
      - API Key
    post:
      consumes:
      - application/json
      description: 创建 API Key，明文仅返回一次（后续不可再查），库中只存 SHA-256 hash；仅系统级 API Key 可操作
      parameters:
      - description: Key 名称
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.createAPIKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  properties:
                    id:
                      type: string
                    key:
                      type: string
                    name:
                      type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - ApiKeyAuth: []
      summary: 创建 API Key
      tags:
      - API Key
  /api/v1/api-keys/{id}:
    delete:
      description: 按 ID 删除 API Key
      parameters:
      - description: API Key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  properties:
                    id:
                      type: string
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - ApiKeyAuth: []
      summary: 删除 API Key
      tags:
      - API Key
  /api/v1/api-keys/{id}/permissions:
    put:
      consumes:
      - application/json
      description: 全量更新 API Key 的 MCP 权限：mcp_tools（Tool 白名单，空 = 无 Tool 权限）、mcp_kb_scope（""
        / "all" / "allowlist"）、mcp_kb_ids（allowlist 时的知识库白名单）；仅系统级 API Key 可操作
      parameters:
      - description: API Key ID
        in: path
        name: id
        required: true
        type: string
      - description: MCP 权限配置
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/store.APIKeyPermissions'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  properties:
                    id:
                      type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - ApiKeyAuth: []
      summary: 更新 MCP 权限
      tags:
      - API Key
  /api/v1/api-keys/{id}/toggle:
    post:
      consumes:
      - application/json
      description: 启用或停用指定 API Key；停用后该 Key 请求返回 401
      parameters:
      - description: API Key ID
        in: path
        name: id
        required: true
        type: string
      - description: 启用状态
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.toggleAPIKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  properties:
                    enabled:
                      type: boolean
                    id:
                      type: string
                  type: object
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - ApiKeyAuth: []
      summary: 启停 API Key
      tags:
      - API Key
  /api/v1/auth/exchange:
    post:
      consumes:
      - application/json
      description: 用回调后拿到的一次性 ticket 换取会话 JWT；ticket 仅可成功消费一次
      parameters:
      - description: 一次性 ticket
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.exchangeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  properties:
                    token:
                      type: string
                  type: object
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
      summary: 换取会话 JWT
      tags:
      - 认证
  /api/v1/auth/github/callback:
    get:
      description: GitHub OAuth2 回调；成功后 302 到 /login?ticket=xxx。校验失败不创建会话
      responses:
        "302":
          description: Found
      summary: GitHub 回调
      tags:
      - 认证
  /api/v1/auth/github/login:
    get:
      description: GitHub 使用 OAuth2 适配（非 OIDC），302 到 GitHub 授权页
      produces:
      - application/json
      responses:
        "302":
          description: Found
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
      summary: 发起 GitHub 登录
      tags:
      - 认证
  /api/v1/auth/me:
    get:
      description: 返回当前凭据身份：apikey → {kind,is_bootstrap}；oidc → {kind,user_id,provider,name}
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.Response'
      security:
      - ApiKeyAuth: []
      summary: 当前身份
      tags:
      - 认证
  /api/v1/auth/oidc/{provider}/callback:
    get:
      description: OIDC 授权码回调；成功后 302 到 /login?ticket=xxx（一次性，前端换取 JWT）。校验失败不创建会话
      parameters:
      - description: OIDC provider 名
        in: path
        name: provider
        required: true
        type: string
      responses:
        "302":
          description: Found
      summary: OIDC 回调
      tags:
      - 认证
  /api/v1/auth/oidc/{provider}/login:
    get:
      description: 按 provider 名发起 OIDC 授权码登录，302 重定向到对应 issuer 授权页
      parameters:
      - description: OIDC provider 名（见 /auth/providers）
        in: path
        name: provider
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Found
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.Response'
      summary: 发起 OIDC 登录
      tags:
      - 认证
  /api/v1/auth/providers:
    get:
      description: 返回已启用的三方登录 Provider（name/type/display_name），不含 client_secret 等机密；未配置时为空数组
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/auth.ProviderView'
                  type: array
              type: object
      summary: 登录 Provider 列表
      tags:
      - 认证
  /api/v1/chat:
    post:
      consumes:
      - application/json
      description: '接收问题与可选的会话、知识库范围，走 RAG 编排返回回答与引用来源。默认返回 JSON；请求带 Accept: text/event-stream
        或 query stream=1 时返回 SSE 流式（事件序列：thinking×N 思考链路 → sources 引用来源 → chunk×N
        文本增量 → done 正常结束 / error 出错终止；思考链路开启时才有 thinking 事件）'
      parameters:
      - description: 问答请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.chatRequest'
      produces:
      - application/json
      - text/event-stream
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.Response'
            - properties:
                data:
                  $ref: '#/definitions/rag.RAGResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.Response'
        "401":
          description: Unauthorized
          schema:
