# ============================================================================
# 构建并推送 Docker 镜像到 GitHub Container Registry (ghcr.io)
#
# 触发：
#   - push 到 main        → 推送 ghcr.io/bin-hy/documentsrag:latest + :sha-<短sha> + :main
#   - push v* 标签        → 推送 :<版本>（如 v1.2.0 → :1.2.0、:1.2、:1）+ :sha-<短sha>
#   - 手动 workflow_dispatch（Actions 页面 Run workflow）
#
# 镜像：ghcr.io/bin-hy/documentsrag（多架构 linux/amd64 + linux/arm64）
# 用途：docker-compose.prod.yml 免编译拉取部署；本仓库 docker-compose.yml
#       构建时也会打相同 tag，方便本地手动 docker push。
#
# 权限：GITHUB_TOKEN 自动获得 packages: write；如需在 GitHub Packages 设置中
#       将镜像设为公开，请在 Packages 页面修改可见性。
# ============================================================================

name: docker-publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: 构建并推送 ghcr 镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 多架构构建需要 QEMU 模拟（arm64）与 BuildKit
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      # 用 GITHUB_TOKEN 登录 ghcr.io（无需额外 secret）
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 生成镜像标签（仓库名含大写，ghcr 要求小写，故写死小写全名）
      - name: 生成镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bin-hy/documentsrag
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 层缓存（GitHub Actions 缓存后端），加速重复构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
