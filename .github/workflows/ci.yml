# CI：push 到 main 或 PR 时执行 gofmt / vet / build / test 与前端类型检查构建
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ---- 格式检查 ----
      - name: gofmt 检查
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件不符合 gofmt 格式，请执行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi
          echo "gofmt 检查通过"

      # ---- 前端（产物进 internal/webui/dist，被 go:embed 打包，必须先于 Go 构建）----
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 前端类型检查与构建（含 vue-tsc）
        working-directory: frontend
        run: npm run build

      - name: 前端单元测试（vitest：SSE 解析 / 流式降级状态机）
        working-directory: frontend
        run: npm test

      # ---- Go 静态检查与编译 ----
      - name: Go 编译
        run: go build ./...

      - name: go vet 静态检查
        run: go vet ./...

      # ---- 测试 ----
      - name: Go 单元测试
        run: go test ./...

      - name: 关键包数据竞争检测
        run: go test -race ./internal/store/... ./internal/task/... ./internal/api/... ./internal/eval/...
