# ============================================================================
# BinRag 生产部署 Compose（免编译：直接拉取 ghcr.io 已发布镜像）
#
# 用法：
#   1. 编辑 deploy/configs/config.docker.yaml，填入你的模型服务信息
#   2. docker compose -f docker-compose.prod.yml pull   # 拉取最新镜像
#   3. docker compose -f docker-compose.prod.yml up -d  # 启动全部服务
#   4. 打开 http://localhost:8085
#
# 与 docker-compose.yml 的区别：binrag-server 不现场构建，直接使用
# ghcr.io/bin-hy/documentsrag:<TAG> 镜像（默认 latest，可用环境变量覆盖：
#   BINRAG_IMAGE_TAG=v1.2.0 docker compose -f docker-compose.prod.yml up -d）。
# 镜像由 GitHub Actions（.github/workflows/docker-publish.yml）在 main 分支
# 推送和 v* 标签发布时自动构建并推送到 GitHub Container Registry。
#
# 项目名固定 binrag-prod，与开发/一键构建环境的卷隔离。
# ============================================================================

name: binrag-prod

services:
  postgres:
    image: postgres:16
    # 如需从宿主机连接调试数据库，可取消下面注释（端口与 dev 环境错开避免冲突）：
    # ports:
    #   - "5433:5432"
    environment:
      - POSTGRES_USER=binrag
      - POSTGRES_PASSWORD=binrag
      - POSTGRES_DB=binrag
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binrag"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  binrag-server:
    image: ghcr.io/bin-hy/documentsrag:${BINRAG_IMAGE_TAG:-latest}
    ports:
      - "8085:8085"
    volumes:
      # 配置文件（只读，缺失则容器启动即失败）：编辑后重启生效
      - ./deploy/configs/config.docker.yaml:/app/configs/config.yaml:ro
      # 上传文件持久化（file_storage_dir=./data/uploads → /app/data/uploads）
      - data_uploads:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8085/swagger/index.html || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:
  data_uploads:
