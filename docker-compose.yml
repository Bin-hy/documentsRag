# ============================================================================
# BinRag 完整部署 Compose（用户一键启动：构建镜像 + 数据库 + 运行）
#
# 用法：
#   1. 编辑 deploy/configs/config.docker.yaml，填入你的模型服务信息
#      （embedder / llm / reranker 的 key 与地址、server.bootstrap_api_key）
#   2. docker compose up -d --build     # 构建镜像并启动全部服务
#   3. 打开 http://localhost:8085
#
# 本文件是「一键构建 + 运行」形态：binrag-server 使用仓库根 Dockerfile 现场构建，
# 构建产物同时打 tag 为 ghcr.io/bin-hy/documentsrag:latest，方便手动 docker push。
# 想免编译直接拉取已发布的镜像部署，请用 docker-compose.prod.yml。
#
# 数据持久化：
#   - 上传文件 → 命名卷 data_uploads（容器内 /app/data，uid 1000）
#     如需直接查看宿主机文件，可改为 ./data:/app/data 并确保目录属主 1000:1000
#     （sudo chown -R 1000:1000 ./data）
#   - 元数据   → PostgreSQL 卷 pg_data
#   - 向量数据 → Qdrant 卷 qdrant_data
# 开发环境（只起数据库依赖）请用 docker-compose.dev.yml。
# ============================================================================

name: binrag

services:
  postgres:
    image: postgres:16
    # 如需从宿主机连接调试数据库，可取消下面注释（端口与 dev 环境错开避免冲突）：
    # ports:
    #   - "5433:5432"
    environment:
      - POSTGRES_USER=binrag
      - POSTGRES_PASSWORD=binrag
      - POSTGRES_DB=binrag
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binrag"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  binrag-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/bin-hy/documentsrag:latest
    ports:
      - "8085:8085"
    volumes:
      # 配置文件（只读，缺失则容器启动即失败）：编辑后重启生效
      - ./deploy/configs/config.docker.yaml:/app/configs/config.yaml:ro
      # 上传文件持久化（file_storage_dir=./data/uploads → /app/data/uploads）
      - data_uploads:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8085/swagger/index.html || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # RAGAS 评测微服务（Python / uv / FastAPI）
  # 注意：不配置 ports —— 不暴露宿主端口，仅 compose 内网可达，入口统一走 Go 代理（/api/v1/eval/*）
  # 前置条件：
  #   1. .env 中配置 RAGAS_EVAL_API_KEY（BinRag 中创建的 ragas-eval 专用 API Key）、
  #      EVAL_INTERNAL_TOKEN（与 Go 侧 eval_internal_token 一致的共享内部令牌）、
  #      EVAL_JUDGE_* / EVAL_EMBED_*（评审模型与 Embedding 的 OpenAI 兼容端点，须与索引进库同源）
  #   2. deploy/configs/config.docker.yaml 中配置 eval_service_url=http://ragas-eval:8090
  #      与 eval_internal_token（Go 代理所需）
  ragas-eval:
    build:
      context: ./services/ragas-eval
    environment:
      - EVAL_LISTEN_PORT=8090
      - EVAL_BINRAG_BASE_URL=http://binrag-server:8085   # 回调 Go 的内网地址
      - EVAL_BINRAG_API_KEY=${RAGAS_EVAL_API_KEY}         # 评测专用 API Key（.env 注入）
      - EVAL_INTERNAL_TOKEN=${EVAL_INTERNAL_TOKEN}        # 与 Go 代理共享的内部令牌
      - EVAL_JUDGE_BASE_URL=${EVAL_JUDGE_BASE_URL}        # Judge LLM OpenAI 兼容端点
      - EVAL_JUDGE_API_KEY=${EVAL_JUDGE_API_KEY}
      - EVAL_JUDGE_MODEL=${EVAL_JUDGE_MODEL}
      - EVAL_EMBED_BASE_URL=${EVAL_EMBED_BASE_URL}        # Embedding（必须与索引同源）
      - EVAL_EMBED_API_KEY=${EVAL_EMBED_API_KEY}
      - EVAL_EMBED_MODEL=${EVAL_EMBED_MODEL}
      - EVAL_DB_PATH=/data/eval.db
      - EVAL_MAX_RUNNING_TASKS=2
    volumes:
      - eval_data:/data
    depends_on:
      binrag-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/healthz').status==200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  pg_data:
  qdrant_data:
  data_uploads:
  eval_data:
