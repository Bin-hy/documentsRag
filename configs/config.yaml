# BinRag 配置文件

# Embedding 提供者配置
embedder:
  # provider: openai / local（本地兼容 OpenAI 接口的模型）
  provider: "openai"
  # API 地址（本地模型时改为 Ollama/vLLM 地址，如 http://localhost:11434/v1）
  base_url: "https://xxx"
  # API Key
  api_key: "sk-xxx"
  # 模型名称
  model: "text-embedding-v4"
  # 向量维度
  dimension: 1024
  # 单次 API 调用最大条数
  batch_size: 10
  # 最大重试次数
  max_retries: 3
  # 限流 QPS
  qps: 10

# 向量存储配置（Qdrant）
vectorstore:
  # Qdrant gRPC 地址
  host: "localhost:6334"
  # Collection 名称
  collection_name: "binrag"
  # 向量维度（需与 embedder.dimension 一致）
  dimension: 1024
  # 距离度量：cosine / euclid / dot
  distance: "cosine"

# 分块器配置
chunker:
  # 策略：fixed / recursive / heading
  # fixed: 固定大小分块
  # recursive: 递归分块，优先按标题分块，标题不足
  # heading: 仅按标题分块
  strategy: "recursive"
  # 目标 chunk 大小（token 数）
  chunk_size: 500
  # 重叠大小（token 数）
  chunk_overlap: 50
  # Markdown 标题分块的目标层级
  heading_level: 2

# 检索器配置
retriever:
  # 最终返回的结果数量
  top_k: 10
  # RRF 融合常数（越大排名差距越小）
  rrf_k: 60
  # 向量检索权重
  vector_weight: 0.7
  # BM25 关键词检索权重
  bm25_weight: 0.3
  # 是否启用 BM25 混合检索
  enable_bm25: true
  # 是否启用 Reranker 重排序
  enable_reranker: true

# 重排序配置（Cross-encoder API，兼容 /v1/rerank 接口）
reranker:
  # API 地址（支持 Jina/Cohere/本地 bge-reranker 等兼容接口）
  base_url: "https://xxx"
  # API Key
  api_key: "sk-xxx"
  # 模型名称
  model: "bge-reranker-v2-m3"
  # 重排序后保留的结果数量
  top_n: 5
  # 最大重试次数
  max_retries: 3
  # 限流 QPS
  qps: 10

# LLM 提供者配置（OpenAI 兼容 /v1/chat/completions，支持 GPT/豆包/DeepSeek/vLLM 等）
llm:
  # API 地址（本地模型时改为 Ollama/vLLM 地址，如 http://localhost:11434/v1）
  base_url: "https://xxx"
  # API Key（本地模型可留空，省略鉴权头）
  api_key: "sk-xxx"
  # 模型名称
  model: "gpt-4o"
  # 生成温度
  temperature: 0.7
  # 单次生成最大 token 数
  max_tokens: 2048
  # 最大重试次数
  max_retries: 3
  # 限流 QPS
  qps: 10
  # HTTP 超时（秒）
  timeout: 60

# RAG 编排配置
rag:
  # 检索返回的片段数量
  top_k: 5
  # 注入上下文的 token 预算（超预算截断）
  max_context_tokens: 2048
  # 注入上下文的片段数量上限
  max_chunks: 5
  # 是否启用 Query 改写（不配置默认启用）
  enable_rewrite: true
  # 对话历史容量（超出丢弃最旧消息）
  history_capacity: 50
  # 注入生成请求的历史消息条数
  history_limit: 10
  # Prompt 模板文件路径（留空使用内置默认模板）
  system_prompt_path: ""
  context_template_path: ""
  rewrite_template_path: ""

# 元数据存储（PostgreSQL）
postgres:
  # 连接串（docker-compose 默认账号）
  dsn: "postgres://binrag:binrag@localhost:5432/binrag"

# HTTP 服务配置
server:
  # 监听端口
  port: 8085
  # 上传文件存储目录
  file_storage_dir: "./data/uploads"
  # 上传大小上限（MB）
  upload_max_size_mb: 1024
  # 入库 worker 并发数
  worker_count: 5
  # 任务失败最大重试次数
  task_max_retries: 3
  # 是否启用 API Key 认证
  auth_enabled: true
  # 首次启动种子 API Key（建完首个 Key 后建议删除该配置）
  bootstrap_api_key: ""
  # 全局限流 QPS（0 表示不限制）
  rate_limit_qps: 0

