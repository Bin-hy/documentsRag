# ============================================================================
# ragas-eval —— BinRag RAGAS 评测微服务
# uv 管理的 Python 项目定义（依赖清单对齐 docs/35-ragas评测/architect-design.md §5.2）
# Python 钉 >=3.11,<3.13：ragas 生态对 3.13 支持滞后；uv.lock 提交仓库保证可复现
# ============================================================================

[project]
name = "ragas-eval"
version = "0.1.0"
description = "BinRag RAGAS 评测微服务：异步采集 + 四指标中文评审 + 报告持久化"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",                   # Web 框架
    "uvicorn[standard]>=0.30",          # ASGI 服务器
    "ragas>=0.2,<0.4",                  # 评测框架（SingleTurnSample API；ragas 0.4 依赖已移除的 langchain-community vertexai 模块，钉 0.3 线）
    "langchain-openai>=0.2,<1",         # ragas 的 OpenAI 兼容 LLM/Embedding 适配层（与 ragas 0.3 配套的 langchain 0.3 生态）
    "langchain-core<1",                 # 与 langchain-openai 0.3 / ragas 0.3 兼容
    "langchain<0.4",                    # 同上
    "langchain-community<0.4",          # ragas 0.3 依赖其 chat_models.vertexai 模块（0.4 已移除）
    "httpx>=0.27",                      # 异步 HTTP 客户端（回调 Go API / Judge LLM）
    "pydantic>=2.7",
    "pydantic-settings>=2.4",           # env 配置
    "aiosqlite>=0.20",                  # 异步 SQLite
    "python-multipart>=0.0.9",          # 数据集上传（multipart）
    "tenacity>=8.4",                    # 重试/退避
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",                      # httpx mock
    "ruff>=0.6",                        # lint + format
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src 布局：wheel 打包 src/ragas_eval
[tool.hatch.build.targets.wheel]
packages = ["src/ragas_eval"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
# E: pycodestyle 错误；W: 警告；F: pyflakes；I: import 排序；UP: pyupgrade；B: bugbear；ASYNC: 异步陷阱
select = ["E", "W", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 惯例：Depends/File/Form/Query 必须出现在参数默认值（B008 为误报）
"src/ragas_eval/api/**" = ["B008"]
"src/ragas_eval/main.py" = ["B008"]
# 中文提示词正文为整段文本，不拆行（E501 放行）
"src/ragas_eval/core/prompts.py" = ["E501"]
# 测试数据/断言行较长（E501 放行）；_wait_status 的 timeout 参数非异步超时陷阱（ASYNC109 放行）
"tests/**" = ["E501", "ASYNC109"]

[tool.pytest.ini_options]
# pytest-asyncio 自动模式：async def 测试无需逐条装饰
asyncio_mode = "auto"
testpaths = ["tests"]
